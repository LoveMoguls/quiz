<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style></head><body><title>Isabellas samhällsquiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: en smal kolumn, en sak i taget, stora tryckytor.
   Valsedelns gult och blått bär färgen. Riksdagens 349 platser visar framstegen. */
:root{
  --bg:#EDF2F8; --card:#FFFFFF; --ink:#14213A; --muted:#536079; --line:#CBD6E4; --seat:#C6D2E2;
  --sun:#FFC933; --sun-deep:#B67B00; --sun-soft:#FFF2C2; --on-sun:#14213A;
  --sea:#1D56C4; --sea-soft:#DCE7FB; --on-sea:#FFFFFF;
  --good:#17794B; --good-soft:#DAF2E5; --bad:#B93A22; --bad-soft:#FBE3DC;
  --paper-blue:#A9C8F5; --paper-white:#FAFAF5;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --card:#172238; --ink:#EDF2FA; --muted:#A5B2C9; --line:#31415F; --seat:#31415F;
    --sun:#FFC933; --sun-deep:#FFC933; --sun-soft:#3A3111; --on-sun:#14213A;
    --sea:#8CB2FF; --sea-soft:#1D2D52; --on-sea:#0E1626;
    --good:#62D6A0; --good-soft:#12362A; --bad:#FF9A85; --bad-soft:#42211B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --card:#172238; --ink:#EDF2FA; --muted:#A5B2C9; --line:#31415F; --seat:#31415F;
  --sun:#FFC933; --sun-deep:#FFC933; --sun-soft:#3A3111; --on-sun:#14213A;
  --sea:#8CB2FF; --sea-soft:#1D2D52; --on-sea:#0E1626;
  --good:#62D6A0; --good-soft:#12362A; --bad:#FF9A85; --bad-soft:#42211B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.125rem;line-height:1.5;margin:0}
.wrap{max-width:640px;margin-inline:auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem}
h2{font-size:1.4rem}
h3{font-size:1.15rem}
p{margin:0}
ol,ul{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.eyebrow{font-family:var(--display);font-weight:500;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.95rem}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* Knappar */
.btn{font-family:var(--display);font-weight:600;font-size:1.1rem;line-height:1.2;border:0;border-radius:14px;padding:14px 20px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;width:100%}
.btn small{font-family:var(--body);font-weight:400;font-size:.9rem;opacity:.9}
.btn-go{background:var(--sea);color:var(--on-sea)}
.btn-sun{background:var(--sun);color:var(--on-sun)}
.btn-quiet{background:var(--card);border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn:not(:disabled):active{transform:translateY(1px)}
.btn-link{background:none;border:0;padding:8px 0;min-height:44px;color:var(--sea);font-family:var(--display);font-weight:500;font-size:1rem;align-self:flex-start}
.btn-las{background:none;border:2px solid var(--line);border-radius:99px;padding:6px 14px;min-height:40px;font-size:.95rem;color:var(--muted);align-self:flex-start}

/* Startsidan */
.hero{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.riksdag svg{display:block;width:100%;max-width:380px;margin-inline:auto;height:auto}
.mandat{font-family:var(--display);font-weight:500;font-size:1.15rem;text-align:center}
.mandat b{font-weight:600;font-size:1.7rem;font-variant-numeric:tabular-nums}
.goal{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:12px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.dot.on{background:var(--sun);border-color:var(--sun-deep)}

.del{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px 14px;text-align:left;width:100%}
.del:hover{border-color:var(--sea)}
.sedel{width:42px;height:54px;border-radius:3px;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:1.3rem;color:var(--on-sun);box-shadow:0 0 0 1.5px var(--line)}
.sedel.gul{background:var(--sun)}
.sedel.bla{background:var(--paper-blue)}
.sedel.vit{background:var(--paper-white)}
.del-titel{font-family:var(--display);font-weight:600;font-size:1.1rem;line-height:1.2}
.del-meta{font-size:.9rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--seat);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--sea);border-radius:99px}

details.vuxna{background:var(--card);border-radius:16px;padding:14px 16px;font-size:1rem}
details.vuxna summary{font-family:var(--display);font-weight:500;cursor:pointer}
details.vuxna ul{list-style:disc;padding-left:20px;display:flex;flex-direction:column;gap:8px;margin-top:12px}
details.vuxna .row{margin-top:14px}

/* Delsidan */
.steg{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.runda{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:60px;text-align:left;width:100%}
.runda:hover{border-color:var(--sea)}
.runda-namn{font-family:var(--display);font-weight:500;line-height:1.2}
.stars{display:inline-flex;gap:2px;flex:none}
.stars svg{width:22px;height:22px}
.stars.big svg{width:56px;height:56px}
.stars .pa{fill:var(--sun);stroke:var(--sun-deep);stroke-width:1.2}
.stars .av{fill:var(--seat);stroke:none}

/* Quiz */
.top{display:flex;align-items:center;gap:12px}
.x{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.3rem;line-height:1;display:grid;place-items:center}
.top .bar{flex:1;height:12px}
.top .count{font-variant-numeric:tabular-nums;font-size:.95rem;color:var(--muted);flex:none}
.q{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.tips{font-size:.95rem;color:var(--muted)}
.q-text{font-family:var(--display);font-weight:600;font-size:1.4rem;line-height:1.25;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{flex-direction:row}
.opts.two .opt{justify-content:center;font-family:var(--display);font-weight:600;font-size:1.2rem}
.opt{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 16px;min-height:56px;text-align:left;font-size:1.05rem;line-height:1.35;display:flex;align-items:center;gap:12px;width:100%;min-width:0;color:var(--ink)}
.opt span{min-width:0;overflow-wrap:break-word;hyphens:manual}
.opt:not(:disabled):hover{border-color:var(--sea)}
.opt.sel{border-color:var(--sea);background:var(--sea-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-color:var(--good);border-style:dashed}
.opt:disabled{cursor:default}
.opt .mark{margin-left:auto;flex:none;font-family:var(--display);font-weight:600;font-size:.9rem}
.opt.ok .mark{color:var(--good)}
.opt.no .mark{color:var(--bad)}
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px;align-items:start}
.match .opt{font-size:.95rem;padding:10px 12px;min-height:68px}
.placed{display:flex;flex-direction:column;gap:8px;counter-reset:steg}
.placed li{counter-increment:steg;display:flex;gap:12px;align-items:center;border:2px solid var(--good);background:var(--good-soft);border-radius:14px;padding:10px 14px;font-size:1.05rem;line-height:1.35}
.placed li::before{content:counter(steg);font-family:var(--display);font-weight:600;color:var(--good);flex:none}
.fb{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb.ok h3{color:var(--good)}
.fb.no h3{color:var(--bad)}

/* Faktakort */
.kort{background:var(--card);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.kort b{font-weight:700}
.knep{background:var(--sun-soft);border-radius:12px;padding:12px 14px;margin-top:auto}
.knep-rubrik{font-family:var(--display);font-weight:600;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;display:block}
.parti-topp{display:flex;align-items:center;gap:14px}
.pchip{flex:none;display:grid;place-items:center;width:60px;height:60px;border-radius:50%;font-family:var(--display);font-weight:600;font-size:1.25rem}
.fakta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px}
.fakta dt{font-family:var(--display);font-weight:500;color:var(--muted);font-size:.95rem}
.fakta dd{margin:0}
.nav2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px}

/* Förklara själv */
.recept{display:flex;flex-wrap:wrap;gap:6px 8px}
.recept li{font-family:var(--display);font-weight:500;font-size:.9rem;background:var(--sea-soft);border-radius:99px;padding:4px 12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-size:1rem;line-height:1.4;cursor:pointer}
.check input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--sea)}
.check span{min-width:0}
.atip{background:var(--sea-soft);border-radius:12px;padding:12px 14px}
.betyg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.betyg .btn{padding:12px 8px;font-size:1rem}

.resultat{background:var(--card);border-radius:20px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

/* Svit, XP, nivå och snabbrunda */
.ikon{width:1.1em;height:1.1em;vertical-align:-.16em;fill:var(--sun);stroke:var(--sun-deep);stroke-width:1.2;flex:none}
.status{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.chip{display:inline-block;font-family:var(--display);font-weight:500;font-size:.95rem;background:var(--sun-soft);border-radius:99px;padding:5px 12px;font-variant-numeric:tabular-nums}
.chip b{font-weight:600}
.chip .ikon{margin-right:3px}
.chip.av{background:var(--bg);color:var(--muted)}
.chip.av .ikon{fill:var(--seat);stroke:var(--muted)}
.niva{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;font-family:var(--display);font-weight:500;font-variant-numeric:tabular-nums}
.niva .bar > i{background:var(--sun)}
.vinst{width:100%;align-items:center}
.svit-chip{display:inline-flex;align-items:center;gap:2px;font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.svit-chip[hidden]{display:none}
.fest{font-family:var(--display);font-weight:600;font-size:1.15rem;color:var(--sun-deep);display:flex;align-items:center;gap:6px;animation:pop .45s both}
.fb .fest{color:var(--ink)}
.milstolpe{background:var(--sun);color:var(--on-sun);border-radius:16px;padding:14px 18px;width:100%;animation:pop .5s both}
.resultat .riksdag{width:100%}
.riksdag .ny{transform-box:fill-box;transform-origin:center;animation:pop .6s .3s both}
.blitz-tal{font-family:var(--display);font-weight:600;font-size:4.5rem;line-height:1;color:var(--sea);font-variant-numeric:tabular-nums;animation:pop .5s both}
.top .bar.blitz > i{transition:width .2s linear}
.top.brad .bar.blitz > i{background:var(--bad)}
.top.brad .count{color:var(--bad);font-weight:700}

@keyframes skak{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes in{from{transform:translateY(8px)}to{transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes bump{50%{transform:scale(1.35)}}
.skak,.opt.no{animation:skak .3s}
.opt.ok,.placed li{animation:pop .3s}
.bump{animation:bump .3s}
.fb{animation:in .2s ease-out}
.stars.big svg{animation:pop .4s both}
.stars.big svg:nth-child(2){animation-delay:.15s}
.stars.big svg:nth-child(3){animation-delay:.3s}
@media (prefers-reduced-motion: reduce){*,*::before{animation:none!important;transition:none!important}}
@media (max-width:420px){
  h1{font-size:1.7rem}
  .q{padding:16px}
  .q-text{font-size:1.25rem}
  .betyg{grid-template-columns:minmax(0,1fr)}
}
</style>

<main id="app" class="wrap" lang="sv"></main>

<script>
/* Allt innehåll i quizet. Källa: instuderingsstödet i samhällskunskap (original.txt).
   Frågetyper:
   mc    = välj ett svar. Rätt svar står ALLTID först i a[] (blandas när frågan visas).
   tf    = sant eller falskt. c = true/false.
   multi = välj flera. De n första i a[] är rätt (blandas när frågan visas).
   match = para ihop. par = [[vänster, höger], ...]
   order = tryck i rätt ordning. steg[] står i rätt ordning (blandas när frågan visas).
*/
const KONFIG = {
  id: 'isabella-samquiz-v1',            // nyckel för sparade stjärnor, unik per quiz
  elev: 'Isabella',
  amne: 'Samhällskunskap',
  matare: { antal: 349, mal: 175, enhet: 'mandat', malNamn: 'majoritet', bild: 'Riksdagens 349 platser' },
  mjuka: ['Social|demokraterna', 'Sverige|demokraterna', 'Krist|demokraterna', 'Vänster|partiet', 'Center|partiet', 'Miljö|partiet',
    'Tryckfrihets|förordningen', 'Yttrandefrihets|grundlagen', 'Successions|ordningen', 'Regerings|formen',
    'Majoritets|regering', 'Minoritets|regering', 'Koalitions|regering', 'Enparti|regering', 'Stats|ministern',
    'Des|information', 'Kommun|fullmäktige', 'Region|fullmäktige', 'stats|makten', 'Filter|bubblor', 'Nät|mobbning',
    'Utbildnings|utskottet', 'Försvars|departementet', 'Finans|departementet', 'Riksdags|ledamot', 'Riksdags|ledamöter'],
  vuxnaRubrik: 'För vuxna: det här är ändrat mot instuderingsbladet',
  vuxna: [
    '<b>Centerpartiet:</b> partiledare är Elisabeth Thand Ringqvist (sedan november 2025), inte Muharrem Demirok.',
    '<b>Liberalerna:</b> partiledare är Simona Mohamsson (sedan juni 2025), inte Johan Pehrson.',
    '<b>Regeringen:</b> efter valet 13 september 2026 sitter M, KD och L kvar som övergångsregering. Talmannen har gett Magdalena Andersson (S) i uppdrag att undersöka om hon kan bilda regering, och en omröstning om statsminister kan hållas tidigast 14 oktober. Quizet följer bladets svar och nämner det nya läget. Fråga läraren vilket svar som gäller på provet.',
    '<b>Ifyllt där bladet var otydligt eller avklippt:</b> Centerpartiets symbol (fyrklöver), statens beslutande organ (riksdagen), ”folkbokförda i tre år”, statens skatter (”till exempel moms”, resten av raden saknas), Vänsterpartiets fråga ”stoppa vinster i välfärden”, Miljöpartiets placering ”grön/mitten” och slutet på meningen om näthat.',
    '<b>Förenklat i bladet:</b> treårsregeln för utländska medborgare gäller inte medborgare i EU-länder, Norge och Island, som får rösta i kommun- och regionval direkt. Quizet följer bladet.',
    'Kontrollerat mot nyhetsläget 3 oktober 2026.'
  ]
};

const PARTIER = {
  V:  { namn: 'Vänsterpartiet', ledare: 'Nooshi Dadgostar', symbol: 'Röd nejlika', skala: 'Vänster', fragor: 'Ekonomisk jämlikhet, stoppa vinster i välfärden, rättigheter.', bg: '#B5121B', fg: '#FFFFFF' },
  S:  { namn: 'Socialdemokraterna', ledare: 'Magdalena Andersson', symbol: 'Röd ros', skala: 'Vänster/mitten', fragor: 'Stärka sjukvården och skolan, bekämpa brottslighetens orsaker.', bg: '#D8102A', fg: '#FFFFFF' },
  MP: { namn: 'Miljöpartiet', ledare: 'Amanda Lind och Daniel Helldén (två språkrör)', symbol: 'Maskros', skala: 'Grön/mitten', fragor: 'Klimatåtgärder, förnybar energi, biologisk mångfald.', bg: '#3F8A2B', fg: '#FFFFFF' },
  C:  { namn: 'Centerpartiet', ledare: 'Elisabeth Thand Ringqvist', symbol: 'Fyrklöver', skala: 'Mitten/höger', fragor: 'Landsbygd, företagande, grön liberalism.', bg: '#0A7B3E', fg: '#FFFFFF' },
  L:  { namn: 'Liberalerna', ledare: 'Simona Mohamsson', symbol: 'Blåklint', skala: 'Mitten/höger', fragor: 'Skolpolitik (ordning och betyg), integration, individens frihet.', bg: '#0069B4', fg: '#FFFFFF' },
  M:  { namn: 'Moderaterna', ledare: 'Ulf Kristersson', symbol: 'Blått M', skala: 'Höger', fragor: 'Sänkta skatter, hårdare tag mot brott, kärnkraft och energi.', bg: '#1B75AD', fg: '#FFFFFF' },
  KD: { namn: 'Kristdemokraterna', ledare: 'Ebba Busch', symbol: 'Vitsippa', skala: 'Höger', fragor: 'Sjukvård (statligt ansvar), familjestöd, äldreomsorg.', bg: '#1F2F7A', fg: '#FFFFFF' },
  SD: { namn: 'Sverigedemokraterna', ledare: 'Jimmie Åkesson', symbol: 'Blåsippa', skala: 'Höger', fragor: 'Stram invandringspolitik, hårdare straff, svensk kultur och trygghet.', bg: '#F2D21B', fg: '#14213A' }
};

/* Gör ett profilkort av ett parti */
function partiKort(k) {
  const p = PARTIER[k];
  return { profil: { chip: k, rubrik: p.namn, bg: p.bg, fg: p.fg, rader: [['Ledare', p.ledare], ['Symbol', p.symbol], ['Skala', p.skala], ['Frågor', p.fragor]] } };
}

const DELAR = [
/* ───────────────────────── DEL 1 ───────────────────────── */
{
  id: 'd1',
  titel: 'Statsskick och styrelseskick',
  kort: [
    { h: 'Två frågor om varje land', t: ['<b>Fråga 1: Vem har makten?</b> Folket (demokrati) eller en liten grupp (diktatur).', '<b>Fråga 2: Hur får landet sin statschef?</b> Genom val (republik) eller genom arv (monarki).'], knep: 'Varje land får två ord. Sverige: demokrati + monarki.' },
    { h: 'Demokrati', t: ['Betyder <b>folkstyre</b>.', 'Makten utgår från folket. Folket väljer sina ledare i fria och rättvisa val.'], knep: 'På grekiska: demos = folk, kratos = styre. Folk-styre.' },
    { h: 'Diktatur', t: ['Motsatsen till demokrati.', 'En person eller en liten grupp har <b>all makt</b> och kan <b>inte röstas bort</b>.'], knep: 'Diktatorn dikterar. Ingen kan rösta bort diktatorn.' },
    { h: 'Republik', t: ['Statschefen <b>väljs</b> av folket eller parlamentet.', 'Oftast är statschefen en president.', 'Exempel: USA och Finland.'], knep: 'Republik = vald president.' },
    { h: 'Monarki', t: ['Statschefen är en kung, drottning eller kejsare.', 'Titeln <b>ärvs</b> inom släkten.', 'Exempel: Sverige och Storbritannien.'], knep: 'Monarki = kronan går i arv.' },

    { q: 'Vilka etiska regler finns för radio, tv och tidningar?', punkter: ['De traditionella medierna följer pressetiska regler.', 'Hålla sig till sanningen.', 'Kontrollera sina källor noga (vara källkritiska).', 'Ge den anklagade chansen att försvara sig.', 'Respektera människors privatliv: inte publicera namn eller bild om det inte finns ett väldigt stort allmänintresse.'], a: 'Väg två saker mot varandra: allmänhetens rätt att få veta och den enskildes rätt till privatliv. Det finns ett stort allmänintresse av att få veta om en politiker fuskar. För en vanlig privatperson finns det oftast inte.' },

<script>
(function () {
  'use strict';
  const app = document.getElementById('app');
  /* Allt ämnesspecifikt kommer från KONFIG i data.js. */
  const K = Object.assign({ id: 'quiz-v1', elev: '', amne: '', mjuka: [], vuxna: [], vuxnaRubrik: 'För vuxna: det här är ändrat mot instuderingsbladet' }, typeof KONFIG === 'object' ? KONFIG : {});
  const M = Object.assign({ antal: 100, mal: 50, enhet: 'poäng', malNamn: 'halvvägs', bild: 'Halvcirkel med 100 platser' }, K.matare || {});
  const KEY = K.id;
  /* xp, dagar (dagar i rad) och best (rekord) är nya. Äldre sparningar saknar dem och får nollor. */
  function nyttS() { return { stars: {}, ex: {}, miss: {}, day: { d: '', n: 0 }, xp: 0, dagar: { d: '', n: 0 }, best: { svit: 0, blitz: 0 } }; }
  let S = nyttS();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p === 'object') {
        S.stars = p.stars || {}; S.ex = p.ex || {}; S.miss = p.miss || {}; S.day = p.day || S.day;
        S.xp = +p.xp || 0; if (p.dagar && p.dagar.d) S.dagar = p.dagar; if (p.best) Object.assign(S.best, p.best);
      }
    }
  } catch (e) { /* utan sparning fungerar sidan ändå */ }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ok */ } }
  function dagStr(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function idag() { return dagStr(new Date()); }
  function igar() { const d = new Date(); d.setDate(d.getDate() - 1); return dagStr(d); }
  /* Dagar i rad: räknas upp första gången man blir klar med något en ny dag. */
  function dagSvit() { const t = idag(); if (S.dagar.d === t) return false; S.dagar = { d: t, n: S.dagar.d === igar() ? S.dagar.n + 1 : 1 }; return true; }
  function aktivSvit() { return S.dagar.d === idag() || S.dagar.d === igar() ? S.dagar.n : 0; }
  /* XP och nivåer: nivå n kräver 100·n XP till nästa. */
  function niva(xp) { let n = 1, krav = 100; while (xp >= krav) { xp -= krav; n++; krav = 100 * n; } return { n: n, i: xp, krav: krav }; }
  /* Ljud (av som standard) och vibration gäller hela enheten, inte ett visst quiz. */
  const PKEY = 'quizmotor-installningar';
  const PREF = { ljud: false, vib: true };
  try { Object.assign(PREF, JSON.parse(localStorage.getItem(PKEY)) || {}); } catch (e) { /* ok */ }
  function dagKoll() { if (!S.day || S.day.d !== idag()) S.day = { d: idag(), n: 0 }; }
  dagKoll();

  const ALLA = [];
  DELAR.forEach(function (d, di) {
    d.nr = di + 1;
    d.rundor.forEach(function (r, ri) {
      r.id = d.id + 'r' + ri; r.del = d;
      r.q.forEach(function (q, qi) { q.id = r.id + 'q' + qi; ALLA.push(q); });
    });
    d.forklara.forEach(function (f, fi) { f.id = d.id + 'f' + fi; f.del = d; });
  });
  const RUNDOR = DELAR.reduce(function (a, d) { return a.concat(d.rundor); }, []);
  const FORKLARA = DELAR.reduce(function (a, d) { return a.concat(d.forklara); }, []);
  const DAGSMAL = 3;
  const TAL = ['noll', 'ett', 'två', 'tre', 'fyra', 'fem', 'sex'];

  /* ───── Hjälpfunktioner ───── */
  function el(tag, props, kids) {
    const e = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
      if (c == null || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));
    });
    return e;
  }
  function blanda(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  let fxNr = 0;
  function show(nodes) {
    tyst(); fxNr++;
    try { const c = document.getElementById('fx'); c.getContext('2d').clearRect(0, 0, c.width, c.height); } catch (e) { /* ok */ }
    app.replaceChildren.apply(app, nodes.filter(Boolean));
    window.scrollTo(0, 0);
  }
  function ren(html) { return String(html).replace(/<[^>]+>/g, ''); }
  /* Långa sammansatta ord får ett mjukt bindestreck så de bryts snyggt i smala knappar. */
  const MJUK = {};
  K.mjuka.forEach(function (w) { MJUK[w.replace('|', '')] = w.replace('|', '\u00AD'); });
  function mjuk(txt) { return String(txt).replace(/[A-Za-zÅÄÖåäöé]+/g, function (w) { return MJUK[w] || w; }); }
  function skak(b) { b.classList.add('skak'); setTimeout(function () { b.classList.remove('skak'); }, 350); }

  const STJ = 'M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z';
  function stjarnor(n, stor) {
    let s = '';
    for (let i = 0; i < 3; i++) s += '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="' + (i < n ? 'pa' : 'av') + '" d="' + STJ + '"/></svg>';
    return el('span', { class: 'stars' + (stor ? ' big' : ''), html: s, role: 'img', 'aria-label': n + ' av 3 stjärnor' });
  }

  const ELD = '<svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-6 1-9.5z"/></svg>';
  const BLIXT = '<svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>';
  function chip(html, extra) { return el('span', { class: 'chip' + (extra ? ' ' + extra : ''), html: html }); }
  function bump(e) { e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); }
  let AC = null;
  function ljud(typ) {
    if (!PREF.ljud) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      ({ ratt: [660, 880], fel: [196], fest: [523, 659, 784, 1047] })[typ].forEach(function (f, i) {
        const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * 0.08;
        o.type = typ === 'fel' ? 'triangle' : 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
        o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.18);
      });
    } catch (e) { /* inget ljud */ }
  }
  function vib(m) { if (PREF.vib && navigator.vibrate) { try { navigator.vibrate(m); } catch (e) { /* ok */ } } }
  function respons(ratt, fest) { if (fest) { ljud('fest'); vib([15, 40, 15]); } else if (ratt) { ljud('ratt'); vib(12); } else { ljud('fel'); vib([30, 40, 30]); } }
  function nivaRad() {
    const nv = niva(S.xp);
    return el('div', { class: 'niva' }, [el('span', { html: 'Nivå <b>' + nv.n + '</b>' }), el('span', { class: 'bar' }, el('i', { style: 'width:' + Math.round(100 * nv.i / nv.krav) + '%' })), el('span', { class: 'small muted', text: nv.i + ' / ' + nv.krav + ' XP' })]);
  }
  /* Det man vann: XP, längsta svit, dagar i rad och ny nivå. Delas av resultatsidorna. */
  function vinster(xp, basta, nySvit, nyDag, nyNiva) {
    return el('div', { class: 'stack-s vinst' }, [
      el('div', { class: 'status' }, [
        xp ? chip('<b>+' + xp + '</b> XP') : null,
        basta >= 2 ? chip(ELD + ' <b>' + basta + '</b> rätt i rad' + (nySvit ? ' · nytt rekord!' : '')) : null,
        nyDag && S.dagar.n > 1 ? chip(ELD + ' Dag <b>' + S.dagar.n + '</b> i rad') : null
      ]),
      nyNiva ? el('p', { class: 'fest', text: 'Ny nivå! Du är nu på nivå ' + niva(S.xp).n + '.' }) : null,
      nivaRad()
    ]);
  }

  function poang() {
    let s = 0, max = 0;
    RUNDOR.forEach(function (r) { max += 3; s += S.stars[r.id] || 0; });
    FORKLARA.forEach(function (f) { max += 2; s += S.ex[f.id] || 0; });
    return { s: s, max: max, mandat: Math.round(M.antal * s / max) };
  }
  function delPoang(d) {
    let s = 0, max = 0;
    d.rundor.forEach(function (r) { max += 3; s += S.stars[r.id] || 0; });
    d.forklara.forEach(function (f) { max += 2; s += S.ex[f.id] || 0; });
    return { s: s, max: max };
  }

  /* Mätaren: M.antal platser i en halvcirkel. Fylls från vänster. */
  function riksdagSvg(n, fran) {
    if (fran == null) fran = n;
    const rows = 9, r0 = 52, dr = 10.5, cx = 150, cy = 150, seats = [];
    const radii = []; for (let i = 0; i < rows; i++) radii.push(r0 + i * dr);
    const sum = radii.reduce(function (a, b) { return a + b; }, 0);
    const counts = radii.map(function (r) { return Math.round(M.antal * r / sum); });
    counts[rows - 1] += M.antal - counts.reduce(function (a, b) { return a + b; }, 0);
    radii.forEach(function (r, i) {
      for (let k = 0; k < counts[i]; k++) {
        const a = Math.PI - Math.PI * (k + 0.5) / counts[i];
        seats.push({ a: a, x: cx + r * Math.cos(a), y: cy - r * Math.sin(a) });
      }
    });
    seats.sort(function (p, q) { return q.a - p.a; });
    let out = '<svg viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg">';
    seats.forEach(function (s, i) {
      out += '<circle cx="' + s.x.toFixed(1) + '" cy="' + s.y.toFixed(1) + '" r="3.1" fill="' + (i < fran ? 'var(--sea)' : i < n ? 'var(--sun)" class="ny' : 'var(--seat)') + '"/>';
    });
    out += '<line x1="150" y1="14" x2="150" y2="100" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" fill="none"/>';
    out += '<text x="150" y="9" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--display)">' + M.mal + ' = ' + M.malNamn + '</text>';
    return out + '</svg>';
  }

  function malRad() {
    const kids = [el('span', { class: 'small', text: 'Dagens mål: ' + DAGSMAL + ' rundor' })];
    for (let i = 0; i < DAGSMAL; i++) kids.push(el('span', { class: 'dot' + (i < S.day.n ? ' on' : '') }));
    if (S.day.n >= DAGSMAL) kids.push(el('span', { class: 'small', text: 'Klart för idag!' }));
    return el('div', { class: 'goal', role: 'img', 'aria-label': 'Dagens mål: ' + Math.min(S.day.n, DAGSMAL) + ' av ' + DAGSMAL + ' rundor klara' }, kids);
  }

  /* ───── Uppläsning ───── */
  const kanLasa = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  function tyst() { if (kanLasa) { try { window.speechSynthesis.cancel(); } catch (e) { /* ok */ } } }
  function lasKnapp(text) {
    if (!kanLasa) return null;
    const b = el('button', { class: 'btn-las', type: 'button', onclick: function () {
      try {
        const roster = window.speechSynthesis.getVoices();
        const sv = roster.filter(function (v) { return /^sv/i.test(v.lang); })[0];
        if (roster.length && !sv) { b.textContent = 'Ingen svensk röst på den här enheten'; b.disabled = true; return; }
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(typeof text === 'function' ? text() : text);
        u.lang = 'sv-SE'; u.rate = 0.92; if (sv) u.voice = sv;
        window.speechSynthesis.speak(u);
      } catch (e) { b.hidden = true; }
    } }, 'Läs upp');
    return b;
  }

  /* ───── Konfetti ───── */
  function konfetti(antal) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.getElementById('fx'); if (!c || !c.getContext) return;
    const ctx = c.getContext('2d'); const w = c.width = window.innerWidth, h = c.height = window.innerHeight;
    const farg = ['#FFC933', '#1D56C4', '#A9C8F5', '#FAFAF5'];
    const bitar = []; for (let i = 0; i < (antal || 70); i++) bitar.push({ x: w / 2, y: h * 0.35, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 11 - 3, s: 5 + Math.random() * 6, f: farg[i % 4], r: Math.random() * 6 });
    const start = performance.now(), nr = fxNr;
    (function tick(t) {
      if (nr !== fxNr) return;
      const dt = t - start; ctx.clearRect(0, 0, w, h);
      if (dt > 1600) return;
      bitar.forEach(function (b) { b.x += b.vx; b.y += b.vy; b.vy += 0.4; b.r += 0.2; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.globalAlpha = Math.max(0, 1 - dt / 1600); ctx.fillStyle = b.f; ctx.fillRect(-b.s / 2, -b.s / 3, b.s, b.s * 0.66); ctx.restore(); });
      requestAnimationFrame(tick);
    })(start);
  }

  /* ───── Startsidan ───── */
  function hem() {
    dagKoll();
    const p = poang();
    const nasta = RUNDOR.filter(function (r) { return !(S.stars[r.id] > 0); })[0];
    const missar = ALLA.filter(function (q) { return S.miss[q.id]; });
    const kvarEx = FORKLARA.filter(function (f) { return (S.ex[f.id] || 0) < 2; }).length;
    const sedelFarg = ['gul', 'bla', 'vit'];

    const delar = DELAR.map(function (d, i) {
      const dp = delPoang(d);
      return el('li', null, el('button', { class: 'del', type: 'button', onclick: function () { delSida(d); } }, [
        el('span', { class: 'sedel ' + sedelFarg[i % 3], 'aria-hidden': 'true', text: d.nr }),
        el('span', { class: 'stack-s' }, [
          el('span', { class: 'del-titel', text: d.titel }),
          el('span', { class: 'bar' }, el('i', { style: 'width:' + Math.round(100 * dp.s / dp.max) + '%' })),
          el('span', { class: 'del-meta' }, [el('span', { text: d.rundor.length + ' rundor' }), el('span', { text: Math.round(100 * dp.s / dp.max) + ' % klart' })])
        ])
      ]));
    });

    const nollBox = el('div', { class: 'row' });
    function nollKnapp() {
      nollBox.replaceChildren(el('button', { class: 'btn btn-quiet', type: 'button', onclick: function () {
        nollBox.replaceChildren(
          el('button', { class: 'btn btn-quiet', type: 'button', onclick: function () { S = nyttS(); S.day.d = idag(); save(); hem(); } }, 'Ja, börja om från noll'),
          el('button', { class: 'btn btn-quiet', type: 'button', onclick: nollKnapp }, 'Avbryt')
        );
      } }, 'Nollställ alla stjärnor'));
    }
    nollKnapp();

    show([
      el('header', { class: 'stack-s' }, [
        el('p', { class: 'eyebrow', text: K.amne }),
        el('h1', { text: K.elev ? 'Hej ' + K.elev + '!' : 'Hej!' }),
        el('p', { class: 'muted', text: 'Korta rundor. En sak i taget. Det du missar kommer tillbaka tills det sitter.' })
      ]),
      el('section', { class: 'hero' }, [
        el('div', { class: 'riksdag', html: riksdagSvg(p.mandat), role: 'img', 'aria-label': M.bild + '. ' + p.mandat + ' av ' + M.antal + ' är fyllda.' }),
        el('p', { class: 'mandat', html: 'Du har vunnit <b>' + p.mandat + '</b> av ' + M.antal + ' ' + M.enhet }),
        el('p', { class: 'muted small center', text: p.mandat >= M.antal ? 'Alla ' + M.antal + ' är dina. Du kan det här!' : p.mandat >= M.mal ? 'Du har nått ' + M.malNamn + '! Fortsätt tills alla ' + M.antal + ' är dina.' : (M.mal - p.mandat) + ' ' + M.enhet + ' kvar till ' + M.malNamn + '. Varje stjärna ger nya ' + M.enhet + '.' }),
        malRad(),
        statusRad()
      ]),
      nasta

    const timer = setInterval(function () {
      if (!top.isConnected) return clearInterval(timer);
      const kvar = Math.max(0, slutar - Date.now());
      fyll.style.width = (100 * kvar / (BLITZTID * 1000)) + '%';
      tid.textContent = Math.ceil(kvar / 1000) + ' s';
      top.classList.toggle('brad', kvar <= 10000);
      if (!kvar) { clearInterval(timer); slut = true; klar(); }
    }, 200);
    function nasta() {
      if (slut || !top.isConnected) return;
      if (!ko.length) ko = blanda(BLITZ);
      const q = ko.shift();
      const r = RITA[q.t](q, function (ok) {
        svar++;
        if (ok) { ratt++; svit++; basta = Math.max(basta, svit); const g = 10 + (svit >= 3 ? 5 : 0); xp += g; S.xp += g; delete S.miss[q.id]; }
        else { svit = 0; S.miss[q.id] = 1; }
        save(); respons(ok, ok && svit >= 5 && svit % 5 === 0);
        poangEl.innerHTML = BLIXT + ratt; if (ok) bump(poangEl);
        setTimeout(nasta, ok ? 350 : 1100);
      });
      yta.replaceChildren(el('section', { class: 'q' }, [el('h2', { class: 'q-text', text: q.q }), r.nod]));
    }
    function klar() {
      const forra = S.best.blitz || 0, rekord = ratt > forra;
      if (rekord) S.best.blitz = ratt;
      const nySvit = basta >= 3 && basta > (S.best.svit || 0); if (basta > (S.best.svit || 0)) S.best.svit = basta;
      const nyDag = svar ? dagSvit() : false;
      if (ratt) { dagKoll(); S.day.n++; }
      save();
      show([
        el('section', { class: 'resultat' }, [
          el('p', { class: 'eyebrow', text: 'Snabbrunda' }),
          el('p', { class: 'blitz-tal', text: ratt }),
          el('h1', { text: rekord ? (forra ? 'Nytt rekord!' : 'Ditt första rekord!') : ratt ? ratt + ' rätt på ' + BLITZTID + ' sekunder' : 'Tiden tog slut' }),
          el('p', { text: svar ? ratt + ' av ' + svar + ' rätt. ' + (rekord ? (forra ? 'Förra rekordet var ' + forra + '.' : 'Nu har du något att slå.') : 'Ditt rekord är ' + forra + '. ' + (forra - ratt <= 2 ? 'Du var nära!' : 'Kör igen!')) : 'Svara så snabbt du kan nästa gång.' }),
          svar > ratt ? el('p', { class: 'small muted', text: 'Missarna väntar i Träna på missar.' }) : null,
          vinster(xp, basta, nySvit, nyDag, niva(S.xp).n > nivStart),
          malRad()
        ]),
        el('button', { class: 'btn btn-go', type: 'button', onclick: snabbrunda }, S.best.blitz ? 'Kör igen och slå ' + S.best.blitz : 'Kör igen'),
        el('button', { class: 'btn btn-quiet', type: 'button', onclick: hem }, 'Till startsidan')
      ]);
      if (rekord) { konfetti(); respons(true, true); }
    }
    nasta();
  }

  /* ───── Förklara själv: instuderingsfrågorna med facit ───── */
  function forklaraSida(lista, i, tillbaka) {
    if (i >= lista.length) {
      const kan = lista.filter(function (f) { return S.ex[f.id] === 2; }).length;
      dagSvit(); save();
      show([
        el('section', { class: 'resultat' }, [
          el('p', { class: 'eyebrow', text: 'Förklara själv' }),
          el('h1', { text: kan === lista.length ? 'Du kan alla!' : 'Bra tränat!' }),
          el('p', { text: 'Du kan ' + kan + ' av ' + lista.length + ' frågor. De andra kommer först nästa gång.' })
        ]),
        el('button', { class: 'btn btn-go', type: 'button', onclick: tillbaka }, 'Klar')
      ]);
      if (kan === lista.length) konfetti();
      return;
    }
    const f = lista[i];
    const facit = el('div', { class: 'stack', hidden: true });
    const visaBtn = el('button', { class: 'btn btn-go', type: 'button', onclick: function () {
      visaBtn.hidden = true; facit.hidden = false;
      try { facit.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { /* ok */ }
    } }, 'Visa facit');

    facit.append(
      el('section', { class: 'q' }, [
        el('h3', { text: 'Bocka i det du fick med' }),
        el('div', { class: 'stack' }, f.punkter.map(function (p, k) {
          const id = 'chk-' + f.id + '-' + k;
          return el('label', { class: 'check', for: id }, [el('input', { type: 'checkbox', id: id }), el('span', { text: p })]);
        })),
        el('div', { class: 'atip' }, [el('span', { class: 'knep-rubrik', text: 'Så lyfter du svaret mot A' }), el('p', { text: f.a })]),
        lasKnapp(f.punkter.join(' ') + ' Så lyfter du svaret mot A: ' + f.a)
      ]),
      el('h3', { text: 'Hur gick det?' }),
      el('div', { class: 'betyg' }, [['Kunde det', 2, 'btn-go'], ['Nästan', 1, 'btn-sun'], ['Inte än', 0, 'btn-quiet']].map(function (b) {
        return el('button', { class: 'btn ' + b[2], type: 'button', onclick: function () { S.ex[f.id] = b[1]; S.xp += b[1] * 5; save(); forklaraSida(lista, i + 1, tillbaka); } }, b[0]);
      }))
    );

    show([
      el('div', { class: 'top' }, [
        el('button', { class: 'x', type: 'button', 'aria-label': 'Avsluta', onclick: tillbaka }, '×'),
        el('span', { class: 'bar' }, el('i', { style: 'width:' + Math.round(100 * i / lista.length) + '%' })),
        el('span', { class: 'count', text: (i + 1) + ' / ' + lista.length })
      ]),
      el('p', { class: 'eyebrow', text: 'Del ' + f.del.nr + (f.extra ? ' · Extrafråga ur begreppslistan' : ' · Förklara själv') }),
      el('section', { class: 'q' }, [
        el('h2', { class: 'q-text', text: f.q }),
        lasKnapp(f.q),
        el('p', { class: 'small muted', text: 'Säg svaret högt, som om du förklarar för en kompis. Följ receptet:' }),
        el('ol', { class: 'recept' }, ['1 Rätt begrepp', '2 Vad det betyder', '3 Ett exempel', '4 Varför'].map(function (t) { return el('li', { text: t }); }))
      ]),
      visaBtn,
      facit
    ]);
  }

  hem();
})();

</script>
